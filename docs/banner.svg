<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="300"
  viewBox="0 0 1200 300"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">CRYPTO TRACKER — keep your curiosity on the pulse</title>
  <desc id="desc">
    Animated project nameplate. NEXT.JS / MARKETS / EXPLORATION. Artwork is
    decorative and respects reduced-motion preferences.
  </desc>
  <style>
    .bob,
    .cloud {
      animation: float 3s ease-in-out infinite;
    }
    .tail {
      animation: twinkle 2s ease-in-out infinite;
    }
    .twinkle,
    .blink {
      animation: twinkle 1.8s ease-in-out infinite;
    }
    .orbit {
      transform-origin: 146px 109px;
      animation: orbit 35s linear infinite;
    }
    .pulse {
      animation: twinkle 2s ease-in-out infinite;
    }
    .bar {
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }
    @keyframes twinkle {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.3;
      }
    }
    @keyframes orbit {
      to {
        transform: rotate(360deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>
  <rect width="1200" height="300" rx="18" fill="#111d1a" />
  <rect
    x="14"
    y="14"
    width="1172"
    height="272"
    rx="10"
    fill="none"
    stroke="#3b4b40"
  />
  <circle cx="58" cy="56" r="5" fill="#81c8f7" />
  <g font-family="ui-monospace,monospace">
    <text x="76" y="61" font-size="13" letter-spacing="3" fill="#81c8f7">
      JOSE SUSTAITA / THE WORKBENCH
    </text>
    <text
      x="54"
      y="145"
      font-size="53"
      font-weight="700"
      letter-spacing="-2"
      fill="#f5f1e6"
    >
      CRYPTO TRACKER
    </text>
    <text x="58" y="191" font-size="20" fill="#bbc8bb">
      keep your curiosity on the pulse
    </text>
    <path d="M58 221h680" stroke="#3b4b40" />
    <text x="58" y="255" font-size="13" letter-spacing="2" fill="#81c8f7">
      NEXT.JS / MARKETS / EXPLORATION
    </text>
  </g>
  <g transform="translate(840 26)">
    <g fill="none" stroke="#81c8f7" stroke-width="4" stroke-linecap="round">
      <path d="M35 35v170h235M62 145l46-50 42 30 67-65 36 10" />
      <circle class="pulse" cx="253" cy="70" r="8" fill="#81c8f7" />
      <path
        class="bar"
        d="M83 182v-22m47 22v-38m47 38v-60m47 60v-78"
        stroke-width="16"
      />
    </g>
  </g>
</svg>
